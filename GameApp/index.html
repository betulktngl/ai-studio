<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayı Tahmin Oyunu</title>
  <style>
    :root {
      --bg-1: #0b1120;
      --bg-2: #111827;
      --card: rgba(30, 41, 59, 0.88);
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #2563eb;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.16), transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(37, 99, 235, 0.18), transparent 45%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    .kart {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    }

    .ust-satir {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .rozet {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 6px 12px;
      border-radius: 999px;
    }

    .zorluk-secici {
      display: flex;
      background: rgba(15, 23, 42, 0.75);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .zorluk-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .zorluk-btn.aktif {
      background: var(--accent-2);
      color: #ffffff;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .aciklama {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .istatistikler {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
    }

    .stat span {
      display: block;
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat strong {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .girdi-satiri {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="number"] {
      flex: 1;
      min-width: 0;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1.5px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    input[type="number"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ana-btn {
      padding: 13px 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, filter 0.2s ease;
    }

    .ana-btn:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .ana-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .ana-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .durum-kutusu {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      font-weight: 600;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      color: #e2e8f0;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .durum-yuksek {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fde68a;
    }

    .durum-dusuk {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.4);
      color: #bae6fd;
    }

    .durum-kazandi {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .durum-kaybetti,
    .durum-uyari {
      background: rgba(239, 68, 68, 0.16);
      border-color: rgba(239, 68, 68, 0.42);
      color: #fca5a5;
    }

    .gecmis-baslik {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .gecmis-listesi {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 32px;
      margin-bottom: 18px;
    }

    .tahmin-etiket {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
    }

    .tahmin-etiket.yuksek {
      border-color: rgba(245, 158, 11, 0.45);
      color: #fcd34d;
    }

    .tahmin-etiket.dusuk {
      border-color: rgba(56, 189, 248, 0.45);
      color: #7dd3fc;
    }

    .ikincil-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(148, 163, 184, 0.12);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .ikincil-btn:hover {
      background: rgba(148, 163, 184, 0.22);
    }
  </style>
</head>
<body>
  <main class="kart">
    <div class="ust-satir">
      <span id="aralik-rozet" class="rozet">1 - 100 ARASI</span>
      <div class="zorluk-secici" role="group" aria-label="Zorluk Seviyesi">
        <button type="button" class="zorluk-btn" data-mod="kolay">Kolay</button>
        <button type="button" class="zorluk-btn aktif" data-mod="orta">Orta</button>
        <button type="button" class="zorluk-btn" data-mod="zor">Zor</button>
      </div>
    </div>
    <h1>Sayı Tahmin Oyunu</h1>
    <p id="aciklama" class="aciklama">
      Gizli sayıyı kalan hakların bitmeden bul. Her tahminden sonra yön ipucu alırsın.
    </p>

    <div class="istatistikler">
      <div class="stat">
        <span>Kalan Hak</span>
        <strong id="kalan-hak">7</strong>
      </div>
      <div class="stat">
        <span>Yapılan</span>
        <strong id="yapilan-sayisi">0</strong>
      </div>
      <div class="stat">
        <span>En İyi Skor</span>
        <strong id="en-iyi-skor">-</strong>
      </div>
    </div>

    <div class="girdi-satiri">
      <input
        type="number"
        id="tahmin-input"
        placeholder="Tahmin..."
        autocomplete="off"
      />
      <button type="button" id="tahmin-btn" class="ana-btn">Tahmin Et</button>
    </div>

    <div id="durum-kutusu" class="durum-kutusu">
      Başlamak için bir sayı gir ve Tahmin Et butonuna bas.
    </div>

    <div class="gecmis-baslik">Tahmin Geçmişi</div>
    <div id="gecmis-listesi" class="gecmis-listesi"></div>

    <button type="button" id="yeni-oyun-btn" class="ikincil-btn">Yeni Oyun Başlat</button>
  </main>

  <script>
    const MODLAR = {
      kolay: { max: 50, hak: 8, etiket: "1 - 50 ARASI" },
      orta: { max: 100, hak: 7, etiket: "1 - 100 ARASI" },
      zor: { max: 500, hak: 8, etiket: "1 - 500 ARASI" }
    };

    const aralikRozet = document.getElementById("aralik-rozet");
    const zorlukButonlari = document.querySelectorAll(".zorluk-btn");
    const aciklamaEl = document.getElementById("aciklama");
    const kalanHakEl = document.getElementById("kalan-hak");
    const yapilanSayisiEl = document.getElementById("yapilan-sayisi");
    const enIyiSkorEl = document.getElementById("en-iyi-skor");
    const tahminInput = document.getElementById("tahmin-input");
    const tahminBtn = document.getElementById("tahmin-btn");
    const durumKutusu = document.getElementById("durum-kutusu");
    const gecmisListesi = document.getElementById("gecmis-listesi");
    const yeniOyunBtn = document.getElementById("yeni-oyun-btn");

    let aktifMod = "orta";
    let gizliSayi = 0;
    let kalanHak = 0;
    let yapilan = 0;
    let oyunBitti = false;
    const enIyiSkorlar = { kolay: null, orta: null, zor: null };

    function durumYaz(mesaj, sinif = "") {
      durumKutusu.textContent = mesaj;
      durumKutusu.className = "durum-kutusu";
      if (sinif) durumKutusu.classList.add(sinif);
    }

    function skorGuncelle() {
      const rekor = enIyiSkorlar[aktifMod];
      enIyiSkorEl.textContent = rekor === null ? "-" : `${rekor} deneme`;
    }

    function gecmisEkle(sayi, yon) {
      const etiket = document.createElement("span");
      etiket.className = `tahmin-etiket ${yon}`;
      etiket.textContent = yon === "yuksek" ? `${sayi} ↑` : `${sayi} ↓`;
      gecmisListesi.appendChild(etiket);
    }

    function oyunuBaslat() {
      const ayar = MODLAR[aktifMod];
      gizliSayi = Math.floor(Math.random() * ayar.max) + 1;
      kalanHak = ayar.hak;
      yapilan = 0;
      oyunBitti = false;

      aralikRozet.textContent = ayar.etiket;
      aciklamaEl.textContent = `1 ile ${ayar.max} arasındaki gizli sayıyı ${ayar.hak} hak içinde bul.`;
      tahminInput.min = "1";
      tahminInput.max = String(ayar.max);
      tahminInput.placeholder = `1 - ${ayar.max}`;
      tahminInput.value = "";
      tahminInput.disabled = false;
      tahminBtn.disabled = false;

      kalanHakEl.textContent = String(kalanHak);
      yapilanSayisiEl.textContent = "0";
      gecmisListesi.innerHTML = "";
      skorGuncelle();

      durumYaz(`1 - ${ayar.max} arasında bir sayı girerek başla.`);
      tahminInput.focus();
    }

    function oyunuBitir(kazandiMi) {
      oyunBitti = true;
      tahminInput.disabled = true;
      tahminBtn.disabled = true;

      if (kazandiMi) {
        durumYaz(
          `Tebrikler! ${gizliSayi} sayısını ${yapilan} denemede bildin.`,
          "durum-kazandi"
        );
        if (enIyiSkorlar[aktifMod] === null || yapilan < enIyiSkorlar[aktifMod]) {
          enIyiSkorlar[aktifMod] = yapilan;
          skorGuncelle();
        }
      } else {
        durumYaz(
          `Hakların bitti! Gizli sayı ${gizliSayi} idi. Tekrar denemek için Yeni Oyun Başlat'a bas.`,
          "durum-kaybetti"
        );
      }
    }

    function tahminiIsle() {
      if (oyunBitti) return;

      const ayar = MODLAR[aktifMod];
      const raw = tahminInput.value.trim();
      const tahmin = Number(raw);

      if (raw === "" || !Number.isInteger(tahmin) || tahmin < 1 || tahmin > ayar.max) {
        durumYaz(`Lütfen 1 ile ${ayar.max} arasında geçerli bir tam sayı gir.`, "durum-uyari");
        tahminInput.focus();
        return;
      }

      yapilan += 1;
      kalanHak -= 1;
      yapilanSayisiEl.textContent = String(yapilan);
      kalanHakEl.textContent = String(kalanHak);

      if (tahmin === gizliSayi) {
        oyunuBitir(true);
        return;
      }

      if (tahmin < gizliSayi) {
        gecmisEkle(tahmin, "yuksek");
        if (kalanHak === 0) {
          oyunuBitir(false);
          return;
        }
        durumYaz("Daha YÜKSEK bir sayı dene.", "durum-yuksek");
      } else {
        gecmisEkle(tahmin, "dusuk");
        if (kalanHak === 0) {
          oyunuBitir(false);
          return;
        }
        durumYaz("Daha DÜŞÜK bir sayı dene.", "durum-dusuk");
      }

      tahminInput.value = "";
      tahminInput.focus();
    }

    zorlukButonlari.forEach((btn) => {
      btn.addEventListener("click", () => {
        aktifMod = btn.dataset.mod;
        zorlukButonlari.forEach((b) => b.classList.remove("aktif"));
        btn.classList.add("aktif");
        oyunuBaslat();
      });
    });

    tahminBtn.addEventListener("click", tahminiIsle);
    tahminInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") tahminiIsle();
    });
    yeniOyunBtn.addEventListener("click", oyunuBaslat);

    oyunuBaslat();
  </script>
</body>
</html>
