<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Üst Bilgi ve Tema Butonu -->
    <header class="ust-bar">
        <div class="logo">TIME <span>APP</span></div>
        <button id="temaBtn" class="tema-btn">☀️ Aydınlık Mod</button>
    </header>

    <!-- Ana Izgara -->
    <main class="dashboard">
        
        <!-- 1. KART: CANLI SAAT -->
        <section class="kart">
            <div class="etiket">CANLI SAAT</div>
            <div class="saat" id="saat">00:00:00</div>
            <div class="tarih" id="tarih">Yükleniyor...</div>
        </section>

        <!-- 2. KART: KAYDIRMALI ALARM -->
        <section class="kart">
            <div class="etiket">ALARM KUR</div>
            <div class="alarm-icerik">
                <!-- Aşağı/Yukarı Kaydırılabilir Saat & Dakika Seçici -->
                <div class="tekerlek-kapsayici">
                    <div class="tekerlek-kutu">
                        <span class="tekerlek-baslik">Saat</span>
                        <div class="tekerlek-liste" id="saatTekerlek"></div>
                    </div>
                    <div class="iki-nokta">:</div>
                    <div class="tekerlek-kutu">
                        <span class="tekerlek-baslik">Dakika</span>
                        <div class="tekerlek-liste" id="dakikaTekerlek"></div>
                    </div>
                </div>

                <div class="butonlar">
                    <button id="alarmKurBtn" class="btn baslat">Alarmı Kur</button>
                    <button id="alarmIptalBtn" class="btn durdur" style="display: none;">İptal Et</button>
                </div>
                <p id="alarmDurum" class="durum-yazisi">Aktif alarm yok</p>
            </div>
        </section>

        <!-- 3. KART: POMODORO ODAK SAYACI -->
        <section class="kart">
            <div class="etiket">POMODORO ODAK</div>
            <div class="pomodoro-modlar">
                <button id="odakModBtn" class="mod-btn aktif">Odak (25 dk)</button>
                <button id="molaModBtn" class="mod-btn">Mola (5 dk)</button>
            </div>
            <div class="saat" id="pomodoroGosterge">25:00</div>
            <div class="butonlar">
                <button id="pomoBaslatBtn" class="btn baslat">Başlat</button>
                <button id="pomoDurdurBtn" class="btn durdur">Duraklat</button>
                <button id="pomoSifirlaBtn" class="btn sifirla">Sıfırla</button>
            </div>
        </section>

        <!-- 4. KART: KRONOMETRE -->
        <section class="kart">
            <div class="etiket">KRONOMETRE</div>
            <div class="saat" id="kronometre">00:00:00<span class="salise">.00</span></div>
            <div class="butonlar">
                <button id="baslatBtn" class="btn baslat">Başlat</button>
                <button id="durdurBtn" class="btn durdur">Durdur</button>
                <button id="turBtn" class="btn tur">Tur</button>
                <button id="sifirlaBtn" class="btn sifirla">Sıfırla</button>
            </div>
            <ul id="turListesi" class="tur-listesi"></ul>
        </section>

    </main>

    <!-- Alarm / Süre Doldu Bildirim Penceresi -->
    <div id="bildirimModal" class="modal">
        <div class="modal-icerik">
            <h2 id="bildirimBaslik">⏰ Süre Doldu!</h2>
            <p id="bildirimMesaj">Belirlediğin zamana ulaştın.</p>
            <button id="bildirimKapatBtn" class="btn baslat">Tamam, Kapat</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
